<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Tickets - TicketApp</title>
  
  <!-- Gatekeeper Script -->
  <script src="js/auth-check.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/tickets.css" />
</head>
<body>

  <!-- Header will be dynamically inserted by main.js -->
  <header class="main-header" id="dashboard-header"></header>

  <main class="ticket-main">
    <div class="container">
      <header class="ticket-page-header">
        <h1>Manage Tickets</h1>
        <button id="create-ticket-btn" class="btn btn-primary">
          <i class="fas fa-plus"></i> Create New Ticket
        </button>
      </header>

      <!-- The list of tickets will be dynamically inserted here -->
      <div id="ticket-list-container" class="ticket-list"></div>
    </div>
  </main>

  <!-- ================== FOOTER ================== -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> TicketApp. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- ================== MODALS (Hidden by default) ================== -->

  <!-- Create Ticket Modal -->
  <div id="create-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content card">
      <button class="modal-close-btn"><i class="fas fa-times"></i></button>
      <form id="create-ticket-form" class="auth-form" noValidate>
        <h2 class="auth-title">Create New Ticket</h2>
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" class="form-input" placeholder="e.g., Fix homepage bug" required>
        </div>
        <div class="form-group">
          <label for="description">Description (Optional)</label>
          <textarea id="description" class="form-input" rows="4" placeholder="Provide a detailed description of the issue..."></textarea>
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" class="form-input">
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="error-message" id="create-error"></div>
        <div class="form-actions">
          <button type="button" class="btn modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Ticket Modal -->
  <div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content card">
      <button class="modal-close-btn" >
            <i class="fas fa-times"></i>
      </button>
      <form id="edit-ticket-form" class="auth-form" noValidate>
        <h2 class="auth-title">Edit Ticket</h2>
        <input type="hidden" id="edit-ticket-id">
        <div class="form-group">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" class="form-input" rows="4"></textarea>
        </div>
        <div class="form-group">
          <label for="edit-status">Status</label>
          <select id="edit-status" class="form-input">
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="error-message" id="edit-error"></div>
        <div class="form-actions">
          <button type="button" class="btn modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Update Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Main script for this page -->
  <script src="js/main.js"></script>
  <script src="js/tickets.js"></script>
</body>
</html>
