<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - TicketApp</title>
  
  <script src="js/auth-check.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
</head>
<body>

  <header class="main-header" id="dashboard-header"></header>

  <main class="dashboard-main">
    <div class="container">
      <header class="dashboard-header">
        <h1>Dashboard Overview</h1>
        <p>Here's a summary of your support ticket activity.</p>
      </header>

      <div class="stats-grid">
        <div class="card stat-card total-tickets">
          <div class="stat-icon"><i class="fas fa-ticket-alt"></i></div>
          <div class="stat-info">
            <h2 id="total-tickets-stat">25</h2>
            <p>Total Tickets</p>
            <p class="stat-context">All tickets created</p>
          </div>
        </div>
        <div class="card stat-card open-tickets">
          <div class="stat-icon"><i class="fas fa-envelope-open-text"></i></div>
          <div class="stat-info">
            <h2 id="open-tickets-stat">12</h2>
            <p>Open Tickets</p>
            <p class="stat-context">Tickets awaiting response</p>
          </div>
        </div>
        <div class="card stat-card resolved-tickets">
          <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          <div class="stat-info">
            <h2 id="resolved-tickets-stat">13</h2>
            <p>Resolved Tickets</p>
            <p class="stat-context">Successfully closed tickets</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="current-year"></span> TicketApp. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
